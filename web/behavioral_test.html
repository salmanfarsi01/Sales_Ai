<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavioral Signal Test Console</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F8FAFA;
    --surface-card: #FFFFFF;
    --border: #E0E7E6;
    --border-light: #EEF2F1;
    --text: #16201E;
    --text-muted: #5E716E;
    --accent: #0EADAB;
    --accent-hover: #0C9593;
    --accent-dim: rgba(14, 173, 171, 0.08);
    --accent-border: rgba(14, 173, 171, 0.25);
    --warn: #E2574C;
    --warn-dim: #FDF2F1;
    --warn-border: #F7D0CC;
    --track-bg: #EBF1F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    background: #FFFFFF;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 85px);
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel { padding: 28px 32px; }
  .panel-left {
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  @media (max-width: 860px) {
    .panel-left {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(14, 173, 171, 0.15);
  }

  .record-zone {
    margin-top: 12px;
    padding: 28px 0 12px;
    text-align: center;
    border-top: 1px solid var(--border);
  }
  .record-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: #FFFFFF;
    color: var(--accent);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(14, 173, 171, 0.12);
    transition: background 0.15s, transform 0.1s, border-color 0.15s, box-shadow 0.15s;
  }
  .record-btn:hover {
    background: var(--accent-dim);
    box-shadow: 0 4px 12px rgba(14, 173, 171, 0.2);
  }
  .record-btn:active { transform: scale(0.96); }
  .record-btn .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    transition: all 0.2s ease;
  }
  .record-btn.recording {
    border-color: var(--warn);
    animation: pulse 1.6s ease-in-out infinite;
    background: #FFFFFF;
  }
  .record-btn.recording .dot {
    background: var(--warn);
    border-radius: 6px;
    width: 22px;
    height: 22px;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(226, 87, 76, 0.35); }
    50% { box-shadow: 0 0 0 14px rgba(226, 87, 76, 0); }
  }
  .timer {
    margin-top: 14px;
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .status-line {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .dim-row { margin-bottom: 18px; }
  .dim-head {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .dim-head span:first-child {
    font-weight: 500;
    color: var(--text);
  }
  .dim-head .val {
    color: var(--text-muted);
    font-weight: 500;
  }
  .dim-track {
    height: 8px;
    background: var(--track-bg);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .dim-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .dim-fill.warn { background: var(--warn); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    color: var(--text-muted);
    background: #FFFFFF;
    margin-bottom: 24px;
  }
  .badge .light {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #A0ABA8;
  }
  .badge.on .light { background: var(--accent); }
  .badge.on {
    color: var(--accent);
    border-color: var(--accent-border);
    background: var(--accent-dim);
  }

  .json-box {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-height: 420px;
    overflow: auto;
    font-size: 12.5px;
    color: #1E2D2A;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .placeholder {
    color: var(--text-muted);
    font-size: 14px;
    padding: 60px 0;
    text-align: center;
  }
  .error-box {
    background: var(--warn-dim);
    border: 1px solid var(--warn-border);
    color: #C93B2B;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>Behavioral signal test console</h1>
  <p>Record a conversation, stop, and see the engine's evidence and inference output.</p>
</header>

<div class="layout">

  <div class="panel panel-left">
    <p class="section-title">Call setup</p>
    <div class="field">
      <label for="apiEndpoint">Analyze endpoint</label>
      <input id="apiEndpoint" class="mono" value="http://localhost:5002/api/test/analyze-recording">
    </div>
    <div class="field">
      <label for="prospectId">Prospect ID</label>
      <input id="prospectId" value="test_prospect_001">
    </div>

    <div class="record-zone">
      <button id="recordBtn" class="record-btn" aria-label="Start recording">
        <span class="dot"></span>
      </button>
      <div class="timer mono" id="timer">00:00</div>
      <div class="status-line" id="statusLine">Ready to record</div>
    </div>
    <div id="errorBox"></div>
  </div>

  <div class="panel" id="resultsPanel">
    <div class="placeholder">Results will appear here after you stop a recording.</div>
  </div>

</div>

<script>
let mediaRecorder, chunks = [], startTime, timerInterval, stream;

const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const statusLine = document.getElementById('statusLine');
const resultsPanel = document.getElementById('resultsPanel');
const errorBox = document.getElementById('errorBox');

recordBtn.addEventListener('click', () => {
  if (recordBtn.classList.contains('recording')) {
    stopRecording();
  } else {
    startRecording();
  }
});

async function startRecording() {
  errorBox.innerHTML = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    showError('Microphone access was denied or unavailable.');
    return;
  }
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = handleStop;
  mediaRecorder.start();

  recordBtn.classList.add('recording');
  recordBtn.setAttribute('aria-label', 'Stop recording');
  statusLine.textContent = 'Recording...';
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 250);
  resultsPanel.innerHTML = '<div class="placeholder">Recording in progress...</div>';
}

function stopRecording() {
  mediaRecorder.stop();
  stream.getTracks().forEach(t => t.stop());
  clearInterval(timerInterval);
  recordBtn.classList.remove('recording');
  recordBtn.setAttribute('aria-label', 'Start recording');
  statusLine.textContent = 'Processing...';
  resultsPanel.innerHTML = '<div class="placeholder">Analyzing recording...</div>';
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;
}

async function handleStop() {
  const blob = new Blob(chunks, { type: 'audio/webm' });
  const endpoint = document.getElementById('apiEndpoint').value.trim();

  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');
  formData.append('prospect_id', document.getElementById('prospectId').value);

  try {
    const res = await fetch(endpoint, { method: 'POST', body: formData });
    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
    const data = await res.json();
    renderResults(data);
    statusLine.textContent = 'Ready to record';
  } catch (err) {
    showError(`Could not reach the analyze endpoint: ${err.message}`);
    resultsPanel.innerHTML = '<div class="placeholder">No results — see error above.</div>';
    statusLine.textContent = 'Ready to record';
  }
}

function showError(msg) {
  errorBox.innerHTML = `<div class="error-box">${msg}</div>`;
}

function renderResults(data) {
  // Adjust these key paths to match your actual DownstreamInferenceState shape.
  const inf = data.latest_inference || data.inference || data;
  const dims = [
    ['Trust', inf.trust],
    ['Pacing', inf.pacing],
    ['Engagement', inf.engagement],
    ['Momentum', inf.momentum],
    ['Readiness', inf.readiness],
  ];

  const acousticUnavailable = (inf.acoustic_evidence || 'unavailable') === 'unavailable';

  let html = `<p class="section-title">Behavioral inference</p>`;
  html += `<div class="badge ${acousticUnavailable ? '' : 'on'}"><span class="light"></span>
            acoustic evidence: ${inf.acoustic_evidence || 'unavailable'}</div>`;

  dims.forEach(([label, d]) => {
    if (!d) return;
    const score = Math.round((d.score ?? 0) * 100);
    const conf = Math.round((d.confidence ?? 0) * 100);
    const warnClass = label === 'Readiness' && score === 0 ? 'warn' : '';
    html += `
      <div class="dim-row">
        <div class="dim-head"><span>${label}</span><span class="val">${score}% &middot; conf ${conf}%</span></div>
        <div class="dim-track"><div class="dim-fill ${warnClass}" style="width:${score}%"></div></div>
      </div>`;
  });

  if (inf.emotion) {
    const valence = Math.round(((inf.emotion.expressed_valence ?? 0) + 1) * 50);
    const tension = Math.round((inf.emotion.tension_level ?? 0) * 100);
    html += `
      <div class="dim-row">
        <div class="dim-head"><span>Emotion — valence</span><span class="val">${valence}%</span></div>
        <div class="dim-track"><div class="dim-fill" style="width:${valence}%"></div></div>
      </div>
      <div class="dim-row">
        <div class="dim-head"><span>Emotion — tension</span><span class="val">${tension}%</span></div>
        <div class="dim-track"><div class="dim-fill" style="width:${tension}%"></div></div>
      </div>`;
  }

  html += `<p class="section-title" style="margin-top:24px;">Raw JSON</p>
           <div class="json-box mono">${escapeHtml(JSON.stringify(data, null, 2))}</div>`;

  resultsPanel.innerHTML = html;
}

function escapeHtml(str) {
  return str.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
</script>

</body>
</html>
