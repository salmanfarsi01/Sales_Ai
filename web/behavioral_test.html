<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavioral Signal Test Console</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F8FAFA;
    --surface-card: #FFFFFF;
    --border: #E0E7E6;
    --border-light: #EEF2F1;
    --text: #16201E;
    --text-muted: #5E716E;
    --accent: #0EADAB;
    --accent-hover: #0C9593;
    --accent-dim: rgba(14, 173, 171, 0.08);
    --accent-border: rgba(14, 173, 171, 0.25);
    --warn: #E2574C;
    --warn-dim: #FDF2F1;
    --warn-border: #F7D0CC;
    --track-bg: #EBF1F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    background: #FFFFFF;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 85px);
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel { padding: 28px 32px; }
  .panel-left {
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  @media (max-width: 860px) {
    .panel-left {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(14, 173, 171, 0.15);
  }

  .record-zone {
    margin-top: 12px;
    padding: 28px 0 12px;
    text-align: center;
    border-top: 1px solid var(--border);
  }
  .record-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: #FFFFFF;
    color: var(--accent);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(14, 173, 171, 0.12);
    transition: background 0.15s, transform 0.1s, border-color 0.15s, box-shadow 0.15s;
  }
  .record-btn:hover {
    background: var(--accent-dim);
    box-shadow: 0 4px 12px rgba(14, 173, 171, 0.2);
  }
  .record-btn:active { transform: scale(0.96); }
  .record-btn .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    transition: all 0.2s ease;
  }
  .record-btn.recording {
    border-color: var(--warn);
    animation: pulse 1.6s ease-in-out infinite;
    background: #FFFFFF;
  }
  .record-btn.recording .dot {
    background: var(--warn);
    border-radius: 6px;
    width: 22px;
    height: 22px;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(226, 87, 76, 0.35); }
    50% { box-shadow: 0 0 0 14px rgba(226, 87, 76, 0); }
  }
  .timer {
    margin-top: 14px;
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .status-line {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .dim-row { margin-bottom: 18px; }
  .dim-head {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .dim-head span:first-child {
    font-weight: 500;
    color: var(--text);
  }
  .dim-head .val {
    color: var(--text-muted);
    font-weight: 500;
  }
  .dim-track {
    height: 8px;
    background: var(--track-bg);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .dim-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .dim-fill.warn { background: var(--warn); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    color: var(--text-muted);
    background: #FFFFFF;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  .badges-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .badge .light {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #A0ABA8;
  }
  .badge.on .light { background: var(--accent); }
  .badge.on {
    color: var(--accent);
    border-color: var(--accent-border);
    background: var(--accent-dim);
  }
  .badge.warn .light { background: var(--warn); }
  .badge.warn {
    color: var(--warn);
    border-color: var(--warn-border);
    background: var(--warn-dim);
  }

  .json-box {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-height: 420px;
    overflow: auto;
    font-size: 12.5px;
    color: #1E2D2A;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .placeholder {
    color: var(--text-muted);
    font-size: 14px;
    padding: 60px 0;
    text-align: center;
  }
  .error-box {
    background: var(--warn-dim);
    border: 1px solid var(--warn-border);
    color: #C93B2B;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 12px;
  }
  .table-container {
    margin-top: 14px;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .play-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: left;
  }
  .play-table th {
    background: #F4F8F7;
    color: var(--text-muted);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .play-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #E8ECEB;
    vertical-align: top;
  }
  .play-table tr:last-child td {
    border-bottom: none;
  }
</style>
</head>
<body>

<header>
  <h1>Behavioral signal test console</h1>
  <p>Record a conversation, stop, and see the engine's evidence and inference output.</p>
</header>

<div class="layout">

  <div class="panel panel-left">
    <p class="section-title">Call setup</p>
    <div class="field">
      <label for="apiEndpoint">Analyze endpoint</label>
      <input id="apiEndpoint" class="mono" value="/api/test/analyze-recording">
    </div>
    <div class="field">
      <label for="prospectId">Prospect ID</label>
      <input id="prospectId" value="test_prospect_001">
    </div>

    <div class="record-zone">
      <button id="recordBtn" class="record-btn" aria-label="Start recording">
        <span class="dot"></span>
      </button>
      <div class="timer mono" id="timer">00:00</div>
      <div class="status-line" id="statusLine">Ready to record</div>
    </div>
    <div id="errorBox"></div>
  </div>

  <div class="panel" id="resultsPanel">
    <div class="placeholder">Results will appear here after you stop a recording.</div>
  </div>

</div>

<script>
let mediaRecorder, chunks = [], startTime, timerInterval, stream;

const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const statusLine = document.getElementById('statusLine');
const resultsPanel = document.getElementById('resultsPanel');
const errorBox = document.getElementById('errorBox');

recordBtn.addEventListener('click', () => {
  if (recordBtn.classList.contains('recording')) {
    stopRecording();
  } else {
    startRecording();
  }
});

async function startRecording() {
  errorBox.innerHTML = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    showError('Microphone access was denied or unavailable.');
    return;
  }
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = handleStop;
  mediaRecorder.start();

  recordBtn.classList.add('recording');
  recordBtn.setAttribute('aria-label', 'Stop recording');
  statusLine.textContent = 'Recording...';
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 250);
  resultsPanel.innerHTML = '<div class="placeholder">Recording in progress...</div>';
}

function stopRecording() {
  mediaRecorder.stop();
  stream.getTracks().forEach(t => t.stop());
  clearInterval(timerInterval);
  recordBtn.classList.remove('recording');
  recordBtn.setAttribute('aria-label', 'Start recording');
  statusLine.textContent = 'Processing...';
  resultsPanel.innerHTML = '<div class="placeholder">Analyzing recording...</div>';
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;
}

async function handleStop() {
  const blob = new Blob(chunks, { type: 'audio/webm' });
  let endpoint = document.getElementById('apiEndpoint').value.trim();
  if (!endpoint) endpoint = '/api/test/analyze-recording';
  if (!endpoint.startsWith('http://') && !endpoint.startsWith('https://')) {
    if (window.location.protocol === 'file:') {
      endpoint = 'http://127.0.0.1:5002' + (endpoint.startsWith('/') ? endpoint : '/' + endpoint);
    }
  }

  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');
  formData.append('prospect_id', document.getElementById('prospectId').value);

  try {
    const res = await fetch(endpoint, { method: 'POST', body: formData });
    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
    const data = await res.json();
    renderResults(data);
    statusLine.textContent = 'Ready to record';
  } catch (err) {
    showError(`Could not reach the analyze endpoint: ${err.message}`);
    resultsPanel.innerHTML = '<div class="placeholder">No results — see error above.</div>';
    statusLine.textContent = 'Ready to record';
  }
}

function showError(msg) {
  errorBox.innerHTML = `<div class="error-box">${msg}</div>`;
}

function renderResults(data) {
  const inf = data.latest_inference || data.inference || data;
  const frame = data.latest_evidence_frame || {};
  const currentUttSnap = (frame.windows && frame.windows.current_utterance) || {};
  const semSnap = currentUttSnap.semantic_features || {};
  const extractionMode = semSnap.extraction_mode || 'unknown';
  const isLlm = extractionMode === 'llm';
  const turnsCount = data.turns_processed || (data.utterances ? data.utterances.length : 1);
  const baselineLocked = data.is_baseline_locked ?? (inf.baseline_sources && inf.baseline_sources.length > 0);
  const baselineSources = inf.baseline_sources || [];
  const baselineSourceText = baselineSources.length > 0 ? baselineSources.join(', ') : 'intra-call';

  const dims = [
    ['Trust', inf.trust],
    ['Pacing', inf.pacing],
    ['Engagement', inf.engagement],
    ['Momentum', inf.momentum],
    ['Readiness', inf.readiness],
  ];

  const acousticUnavailable = (inf.acoustic_evidence || 'unavailable') === 'unavailable';

  let html = '';
  if (data.transcript) {
    html += `
      <p class="section-title">Full Transcript</p>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; color: var(--text); font-style: italic;">
        “${escapeHtml(data.transcript)}”
      </div>`;
  }

  if (data.utterances && data.utterances.length > 1) {
    html += `
      <p class="section-title">Segmented Turns (${data.utterances.length})</p>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-size: 13px;">`;
    data.utterances.forEach(u => {
      const s = (u.start_ms / 1000).toFixed(1);
      const e = (u.end_ms / 1000).toFixed(1);
      html += `
        <div style="padding: 6px 0; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; gap: 12px;">
          <span><strong style="color: var(--accent);">Turn ${u.turn_index}:</strong> “${escapeHtml(u.text)}”</span>
          <span class="mono" style="color: var(--text-muted); font-size: 11.5px; white-space: nowrap;">${s}s - ${e}s</span>
        </div>`;
    });
    html += `</div>`;
  }

  let baselineText = 'calibrating';
  if (baselineLocked) {
    baselineText = `locked (${baselineSourceText})`;
  } else if (data.calibration_progress) {
    const cp = data.calibration_progress;
    if (cp.elapsed_sec < cp.target_sec) {
      baselineText = `calibrating (${cp.elapsed_sec}s/${cp.target_sec}s elapsed)`;
    } else if (cp.turn_count < cp.target_turns) {
      baselineText = `calibrating (turn ${cp.turn_count}/${cp.target_turns})`;
    } else if (cp.total_words < cp.target_words) {
      baselineText = `calibrating (${cp.total_words}/${cp.target_words} words)`;
    }
  } else {
    baselineText = `calibrating (turn ${data.turn_index || turnsCount}/3)`;
  }

  html += `<p class="section-title">Engine Status & Evidence</p>
    <div class="badges-wrap">
      <div class="badge ${isLlm ? 'on' : 'warn'}">
        <span class="light"></span>
        extraction: ${extractionMode}
      </div>
      <div class="badge ${baselineLocked ? 'on' : ''}">
        <span class="light"></span>
        baseline: ${baselineText}
      </div>
      <div class="badge ${turnsCount >= 1 ? 'on' : ''}">
        <span class="light"></span>
        processed: ${turnsCount} turn(s)
      </div>
      <div class="badge ${acousticUnavailable ? '' : 'on'}">
        <span class="light"></span>
        acoustic evidence: ${inf.acoustic_evidence || 'unavailable'}
      </div>
    </div>`;

  html += `<p class="section-title">Behavioral Inference</p>`;
  dims.forEach(([label, d]) => {
    if (!d) return;
    const score = Math.round((d.score ?? 0) * 100);
    const conf = Math.round((d.confidence ?? 0) * 100);
    const warnClass = label === 'Readiness' && score === 0 ? 'warn' : '';
    html += `
      <div class="dim-row">
        <div class="dim-head"><span>${label}</span><span class="val">${score}% &middot; conf ${conf}%</span></div>
        <div class="dim-track"><div class="dim-fill ${warnClass}" style="width:${score}%"></div></div>
      </div>`;
  });

  if (inf.emotion) {
    const valence = Math.round(((inf.emotion.expressed_valence ?? 0) + 1) * 50);
    const tension = Math.round((inf.emotion.tension_level ?? 0) * 100);
    html += `
      <div class="dim-row">
        <div class="dim-head"><span>Emotion — valence</span><span class="val">${valence}%</span></div>
        <div class="dim-track"><div class="dim-fill" style="width:${valence}%"></div></div>
      </div>
      <div class="dim-row">
        <div class="dim-head"><span>Emotion — tension</span><span class="val">${tension}%</span></div>
        <div class="dim-track"><div class="dim-fill" style="width:${tension}%"></div></div>
      </div>`;
  }

  if (data.play_by_play_turns && data.play_by_play_turns.length > 0) {
    html += `<p class="section-title" style="margin-top:24px;">Play-by-Play Turn Diagnostics</p>
      <div class="table-container">
        <table class="play-table">
          <thead>
            <tr>
              <th>Turn</th>
              <th>Time</th>
              <th>Transcript Text</th>
              <th>WPM</th>
              <th>Base WPM</th>
              <th>Pace Δ%</th>
              <th>Pause</th>
              <th>Latency</th>
              <th>Question?</th>
              <th>Recurrence</th>
              <th>Boundary</th>
              <th>Spec.</th>
              <th>Future</th>
              <th>Conf</th>
              <th>Trust</th>
              <th>Ready</th>
            </tr>
          </thead>
          <tbody>`;
    data.play_by_play_turns.forEach(t => {
      const paceDeltaText = t.pace_delta_pct !== null && t.pace_delta_pct !== undefined ? `${t.pace_delta_pct > 0 ? '+' : ''}${t.pace_delta_pct}%` : 'calibrating';
      const paceColor = t.pace_delta_pct !== null && Math.abs(t.pace_delta_pct) >= 20 ? (t.pace_delta_pct > 0 ? 'var(--accent)' : '#C93B2B') : 'var(--text)';
      const boundClass = t.boundary_score >= 0.8 ? 'color:#C93B2B; font-weight:700;' : '';
      const recText = t.recurrence_type && t.recurrence_type !== 'none' ? `${t.recurrence_type} (${t.recurrence_count})` : '—';
      const qText = t.question_type && t.question_type !== 'none' ? t.question_type : '—';
      const pauseText = t.avg_pause_duration_ms > 0 ? `${Math.round(t.avg_pause_duration_ms)}ms` : '0';
      const latText = t.response_latency_ms !== null && t.response_latency_ms !== undefined ? `${t.response_latency_ms}ms` : '—';
      
      html += `<tr>
        <td class="mono" style="font-weight:600;">#${t.turn_index}</td>
        <td class="mono" style="white-space:nowrap; color:var(--text-muted);">${t.start_sec}s-${t.end_sec}s</td>
        <td style="min-width:180px; max-width:300px; font-size:11.5px;">${escapeHtml(t.text)}</td>
        <td class="mono">${t.speech_rate_wpm}</td>
        <td class="mono">${t.baseline_wpm ?? '—'}</td>
        <td class="mono" style="font-weight:600; color:${paceColor};">${paceDeltaText}</td>
        <td class="mono">${pauseText}</td>
        <td class="mono">${latText}</td>
        <td><span class="mono" style="font-size:11px;">${escapeHtml(qText)}</span></td>
        <td><span class="mono" style="font-size:11px; color:${t.recurrence_type !== 'none' ? '#C93B2B' : 'inherit'}">${escapeHtml(recText)}</span></td>
        <td class="mono" style="${boundClass}">${t.boundary_score.toFixed(1)}</td>
        <td class="mono">${t.specificity_score.toFixed(2)}</td>
        <td class="mono">${t.future_language_score.toFixed(2)}</td>
        <td class="mono">${Math.round(t.semantic_confidence * 100)}%</td>
        <td class="mono" style="font-weight:600;">${Math.round(t.trust_score * 100)}%</td>
        <td class="mono" style="font-weight:600;">${Math.round(t.readiness_score * 100)}%</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  const reportFilename = data.report_file || (data.call_sid ? `reports/behavioral_signal_${data.call_sid}.json` : '');
  if (reportFilename) {
    html += `
      <div style="margin-top: 24px; padding: 14px 16px; background: rgba(14, 173, 171, 0.07); border: 1px solid rgba(14, 173, 171, 0.28); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 16px;">📄</span>
          <div>
            <div style="font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent);">Evaluation Report Saved</div>
            <div class="mono" style="font-size: 12.5px; color: var(--text); font-weight: 500; margin-top: 2px;">${escapeHtml(reportFilename)}</div>
          </div>
        </div>
        <div class="badge on" style="margin: 0; font-size: 11px;">
          <span class="light"></span> saved in reports/
        </div>
      </div>`;
  }

  resultsPanel.innerHTML = html;
}

function escapeHtml(str) {
  return str.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
</script>

</body>
</html>
