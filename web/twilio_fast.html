<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twilio Copilot Diagnostics</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#08101f;color:#edf3ff}main{max-width:1180px;margin:auto;padding:24px 18px}h1{margin:0;font-size:24px}.sub{color:#8fa4d2;margin-top:5px}.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0}.stage{background:#121d34;border:1px solid #273755;border-radius:9px;padding:11px;min-height:58px}.stage b{display:block;font-size:11px;text-transform:uppercase;color:#8ea5d6}.stage span{font-size:12px;color:#aebcdf}.stage[data-state=ready],.stage[data-state=receiving],.stage[data-state=streaming],.stage[data-state=transcribing]{border-color:#38c98a}.stage[data-state=connecting],.stage[data-state=generating]{border-color:#e6b84f}.stage[data-state=error]{border-color:#ff637a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:#101a30;border:1px solid #283957;border-radius:12px;min-height:350px;padding:17px}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#91a8dc;margin:0 0 12px}.turn{padding:9px 11px;border-radius:8px;margin:7px 0}.client{background:#222e4d}.salesperson{background:#15372f}.interim{opacity:.55}.label{font-size:10px;text-transform:uppercase;color:#91a7d5}.answer{font-size:20px;line-height:1.5;white-space:pre-wrap}.meta{font-size:12px;color:#8ea3cc;margin-top:13px}.log{margin-top:15px;background:#080e1a;padding:12px;border-radius:8px;font:12px ui-monospace,monospace;color:#95a7c9;max-height:130px;overflow:auto}.error{color:#ff8193}@media(max-width:850px){.stages{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>user sales</h1><div class="sub">Independent low-latency audio tracks · AI triggered only by client speech</div>
<div class="stages"><div class="stage" id="twilio"><b>Twilio</b><span>Waiting</span></div><div class="stage" id="audio_salesperson"><b>Sales audio</b><span>Waiting</span></div><div class="stage" id="audio_client"><b>Client audio</b><span>Waiting</span></div><div class="stage" id="stt_salesperson"><b>Sales STT</b><span>Waiting</span></div><div class="stage" id="stt_client"><b>Client STT</b><span>Waiting</span></div><div class="stage" id="llm"><b>AI answer</b><span>Waiting</span></div></div>
<div class="grid"><section><h2>Live transcript</h2><div id="transcript"></div></section><section><h2>Recommended response</h2><div class="answer" id="answer">Waiting for client speech…</div><div class="meta" id="sources"></div><div class="meta" id="metrics"></div></section></div><div class="log" id="log"></div>
</main><script>
const transcript=document.querySelector('#transcript'),answer=document.querySelector('#answer'),sources=document.querySelector('#sources'),metrics=document.querySelector('#metrics'),log=document.querySelector('#log');let current=null,interim={};
function note(text,bad=false){const line=document.createElement('div');line.textContent=`${new Date().toLocaleTimeString()}  ${text}`;if(bad)line.className='error';log.appendChild(line);log.scrollTop=log.scrollHeight}
function stage(name,state,detail){const box=document.getElementById(name);if(!box)return;box.dataset.state=state;box.querySelector('span').textContent=detail||state;note(`${name}: ${state}${detail?' — '+detail:''}`,state==='error')}
function turn(role,text,final){let node=interim[role];if(!node){node=document.createElement('div');node.className=`turn ${role} interim`;node.innerHTML='<div class="label"></div><div class="text"></div>';transcript.appendChild(node);interim[role]=node}node.querySelector('.label').textContent=role;node.querySelector('.text').textContent=text;if(final){node.classList.remove('interim');delete interim[role]}}
function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/events`);ws.onopen=()=>note('Dashboard event channel connected');ws.onmessage=({data})=>{const e=JSON.parse(data);const d=e.data||{};if(e.type==='component')stage(d.component,d.state,d.detail);else if(e.type==='status')note(d.message);else if(e.type==='call_start'){transcript.textContent='';note(`Call started: ${d.call_sid}`)}else if(e.type==='transcript')turn(d.role,d.text,d.final);else if(e.type==='suggestion_start'){current=d.id;answer.textContent='';sources.textContent=d.sources.length?'Sources: '+d.sources.join(', '):'No matching local knowledge';metrics.textContent='Generating from: '+d.question}else if(e.type==='suggestion_delta'&&d.id===current)answer.textContent+=d.text;else if(e.type==='suggestion_end'&&d.id===current){if(d.metrics){const m=d.metrics;metrics.textContent+=` · Pinecone: ${m.retrieval_ms}ms · LLM TTFT: ${m.llm_ttft_ms}ms · Gen: ${m.llm_generation_ms}ms · Total pipeline: ${m.pipeline_latency_total_ms}ms`}else{metrics.textContent+=` · TTFT ${d.ttft_ms??'n/a'} ms · total ${d.total_ms} ms`}}else if(e.type==='call_end')note(`Call ended; dropped audio ${d.dropped_audio_chunks}`);else if(e.type==='error')note(d.message,true)};ws.onclose=()=>{note('Dashboard event channel disconnected',true);setTimeout(connect,1200)}}connect();
</script></body></html>
