<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sales Copilot</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, sans-serif
        }

        body {
            margin: 0;
            background: #08101f;
            color: #edf3ff
        }

        main {
            max-width: 1180px;
            margin: auto;
            padding: 22px 18px
        }

        header {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: center
        }

        h1 {
            margin: 0;
            font-size: 24px
        }

        .sub,
        .meta {
            color: #8fa4d2;
            font-size: 13px
        }

        .upload {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #121d34;
            padding: 9px;
            border-radius: 9px
        }

        .upload select {
            background: #0d1830;
            color: #edf3ff;
            border: 1px solid #2c446e;
            border-radius: 7px;
            padding: 9px 12px;
            font-weight: 600;
            min-width: 150px
        }

        .upload button {
            background: #65dda4;
            border: 0;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: 700;
            cursor: pointer
        }

        .stages {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin: 18px 0
        }

        .stage {
            background: #121d34;
            border: 1px solid #273755;
            border-radius: 9px;
            padding: 10px;
            min-height: 55px
        }

        .stage b {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: #8ea5d6
        }

        .stage span {
            font-size: 11px;
            color: #aebcdf
        }

        .stage[data-state=ready],
        .stage[data-state=receiving],
        .stage[data-state=streaming],
        .stage[data-state=transcribing] {
            border-color: #38c98a
        }

        .stage[data-state=connecting],
        .stage[data-state=generating] {
            border-color: #e6b84f
        }

        .stage[data-state=error] {
            border-color: #ff637a
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        section {
            background: #101a30;
            border: 1px solid #283957;
            border-radius: 12px;
            min-height: 340px;
            padding: 17px
        }

        h2 {
            font-size: 13px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #91a8dc;
            margin: 0 0 12px
        }

        .turn {
            padding: 9px 11px;
            border-radius: 8px;
            margin: 7px 0
        }

        .client {
            background: #222e4d
        }

        .salesperson {
            background: #15372f
        }

        .interim {
            opacity: .55
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            color: #91a7d5
        }

        .answer {
            font-size: 20px;
            line-height: 1.5;
            white-space: pre-wrap
        }

        .log {
            margin-top: 14px;
            background: #080e1a;
            padding: 11px;
            border-radius: 8px;
            font: 12px ui-monospace, monospace;
            color: #95a7c9;
            max-height: 135px;
            overflow: auto
        }

        .error {
            color: #ff8193
        }

        @media(max-width:850px) {
            header {
                align-items: flex-start;
                flex-direction: column
            }

            .stages {
                grid-template-columns: repeat(2, 1fr)
            }

            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>user sales</h1>
                <div class="sub">Client questions → context recovery → PDF knowledge → streamed answer</div>
            </div>
            <form class="upload" id="upload"><input id="pdf" name="file" type="file" accept="application/pdf,.pdf" required><button>Upload
                    PDF</button><span class="meta" id="uploadStatus"></span></form>
        </header>
        <div class="stages">
            <div class="stage" id="twilio"><b>Twilio</b><span>Waiting</span></div>
            <div class="stage" id="audio_salesperson"><b>Sales audio</b><span>Waiting</span></div>
            <div class="stage" id="audio_client"><b>Client audio</b><span>Waiting</span></div>
            <div class="stage" id="stt_salesperson"><b>Sales STT</b><span>Waiting</span></div>
            <div class="stage" id="stt_client"><b>Client STT</b><span>Waiting</span></div>
            <div class="stage" id="llm"><b>AI answer</b><span>Waiting</span></div>
        </div>
        <div class="grid">
            <section>
                <h2>Live transcript</h2>
                <div id="transcript"></div>
            </section>
            <section>
                <h2>Recommended response</h2>
                <div class="answer" id="answer">Waiting for client speech…</div>
                <div class="meta" id="sources"></div>
                <div class="meta" id="metrics"></div>
            </section>
        </div>
        <div class="log" id="log"></div>
    </main>
    <script>
        const transcript = document.querySelector('#transcript');
        const answer = document.querySelector('#answer');
        const sources = document.querySelector('#sources');
        const metrics = document.querySelector('#metrics');
        const log = document.querySelector('#log');
        const upload = document.querySelector('#upload');
        const pdf = document.querySelector('#pdf');
        const uploadStatus = document.querySelector('#uploadStatus');

        let current = null;
        let interim = {};

        function note(text, bad = false) {
            const line = document.createElement('div');
            line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
            if (bad) line.className = 'error';
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        function stage(name, state, detail) {
            const box = document.getElementById(name);
            if (!box) return;

            box.dataset.state = state;
            box.querySelector('span').textContent = detail || state;
            note(`${name}: ${state}${detail ? ' — ' + detail : ''}`, state === 'error');
        }

        function turn(role, text, final) {
            let node = interim[role];
            if (!node) {
                node = document.createElement('div');
                node.className = `turn ${role} interim`;
                node.innerHTML = '<div class="label"></div><div class="text"></div>';
                transcript.appendChild(node);
                interim[role] = node;
            }

            node.querySelector('.label').textContent = role;
            node.querySelector('.text').textContent = text;

            if (final) {
                node.classList.remove('interim');
                delete interim[role];
            }
        }

        upload.onsubmit = async event => {
            event.preventDefault();

            const file = pdf.files[0];
            if (!file) {
                uploadStatus.textContent = 'Please choose a PDF file';
                return;
            }
            if (file.size === 0) {
                uploadStatus.textContent = 'Selected file is empty';
                note(`File is empty: ${file.name}`, true);
                return;
            }

            uploadStatus.textContent = 'Uploading...';

            const body = new FormData();
            body.append('file', file);
            body.append('target', 'sales');
            body.append('tenant_id', 'default');

            console.log('Uploading file', { name: file.name, size: file.size });

            try {
                const response = await fetch('/knowledge/upload', { method: 'POST', body });
                const result = response.headers.get('content-type')?.includes('json')
                    ? await response.json()
                    : { message: await response.text() };

                if (!response.ok) throw new Error(result.message || result);

                const docId = result.doc_id;
                note(`Upload accepted. Ingestion job started: ${docId}`);
                pollIngestionStatus(docId);
            } catch (error) {
                uploadStatus.textContent = 'Upload failed';
                note(error.message, true);
            }
        };

        function pollIngestionStatus(docId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/knowledge/status/${docId}`);
                    if (!response.ok) {
                        throw new Error(`Failed to check status: ${response.statusText}`);
                    }
                    const job = await response.json();
                    
                    if (job.status === 'completed') {
                        clearInterval(interval);
                        uploadStatus.textContent = `Completed! ${job.pages} pages · ${job.chunks_total} chunks indexed`;
                        note(`PDF successfully processed and indexed: ${job.filename}`);
                    } else if (job.status === 'failed') {
                        clearInterval(interval);
                        uploadStatus.textContent = 'Processing failed';
                        note(`Processing failed for ${job.filename}: ${job.error}`, true);
                    } else {
                        uploadStatus.textContent = `Processing: ${job.progress}% (${job.chunks_uploaded}/${job.chunks_total} chunks)`;
                    }
                } catch (error) {
                    clearInterval(interval);
                    uploadStatus.textContent = 'Error checking status';
                    note(error.message, true);
                }
            }, 1000);
        }

        function connect() {
            const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/events`);

            ws.onopen = () => note('Dashboard connected');

            ws.onmessage = ({ data }) => {
                const e = JSON.parse(data);
                const d = e.data || {};

                if (e.type === 'component') {
                    stage(d.component, d.state, d.detail);
                } else if (e.type === 'status') {
                    note(d.message);
                } else if (e.type === 'call_start') {
                    transcript.textContent = '';
                    note(`Call started: ${d.call_sid}`);
                } else if (e.type === 'transcript') {
                    turn(d.role, d.text, d.final);
                } else if (e.type === 'suggestion_start') {
                    current = d.id;
                    answer.textContent = '';
                    sources.textContent = d.sources.length ? 'Sources: ' + d.sources.join(', ') : 'Answering from general model knowledge';
                    metrics.textContent = 'Question: ' + d.question;
                } else if (e.type === 'suggestion_delta' && d.id === current) {
                    answer.textContent += d.text;
                } else if (e.type === 'suggestion_end' && d.id === current) {
                    metrics.textContent += ` · TTFT ${d.ttft_ms ?? 'n/a'} ms · total ${d.total_ms} ms`;
                } else if (e.type === 'knowledge_uploaded') {
                    note(`PDF ready: ${d.name}, ${d.pages} pages`);
                } else if (e.type === 'call_end') {
                    note(`Call ended; dropped audio ${d.dropped_audio_chunks}`);
                } else if (e.type === 'error') {
                    note(d.message, true);
                }
            };

            ws.onclose = () => {
                note('Dashboard disconnected', true);
                setTimeout(connect, 1200);
            };
        }

        connect();
    </script>
</body>

</html>
